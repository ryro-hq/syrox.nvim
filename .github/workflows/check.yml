name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.5
      - name: Load runtime and check Lua syntax
        run: >-
          nvim --headless -u NONE
          '+set rtp+=.'
          '+lua for _, file in ipairs(vim.fn.glob("**/*.lua", false, true)) do assert(loadfile(file)) end'
          '+lua require("syrox").setup()'
          '+qa!'
